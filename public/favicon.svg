<!-- App mark. Emerald tile, white star — the same shape Login.jsx draws as its
     BrandMark, so the icon on the home screen is the one the app opens with.

     It replaces a purple starburst placeholder that had nothing to do with this
     project: it was the tab icon, the apple-touch-icon, the installed PWA icon
     AND the icon on every push notification, while index.html and manifest.json
     both declared the theme colour #059669. Installed on a phone, the app was
     purple everywhere it was seen from the outside and emerald everywhere inside.

     This is the "any" variant, drawn to sit comfortably in a square with its own
     margin. favicon-maskable.svg is the same mark laid out for Android's circular
     crop; see the note there. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Micro-SACCOS">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#tile)" />
  <path
    d="M24 11.2l4.12 8.35 9.21 1.34-6.66 6.5 1.57 9.17L24 32.23l-8.24 4.33 1.57-9.17-6.66-6.5 9.21-1.34L24 11.2z"
    fill="#ffffff"
  />
</svg>
